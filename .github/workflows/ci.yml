name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Worker tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      # Bundles the Worker exactly as `wrangler deploy` would, without uploading
      - run: npm run build

  schema:
    name: Schema and row-level security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply Supabase stand-in
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_shim.sql
      - name: Apply schema.sql
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Run RLS tests
        run: psql -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/tests/rls_test.sql
